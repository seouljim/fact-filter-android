name: APK 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 빌드
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/debug/app-debug.apk fact-filter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fact-filter-apk
          path: fact-filter.apk

      # 휴대폰에서 바로 받을 수 있도록 "latest" 릴리스에 항상 최신 파일을 올려 둔다.
      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest fact-filter.apk \
            --title "최신 시험판 (빌드 ${{ github.run_number }})" \
            --notes "휴대폰에서 fact-filter.apk 를 받아 설치하세요." \
            --target "${{ github.sha }}"
